<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הצטרפות לחדר · SportDle</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  /* אותה שפה כמו המשחק ודפי התוכן: קרקע אבן, דיו, כפתור ראשי מוצק ומשני לבן */
  html,body{margin:0;height:100%;background:#ECEAE5;color:#454850;
    font-family:'Heebo',system-ui,sans-serif;display:flex;
    align-items:center;justify-content:center;text-align:center}
  body>div{padding:24px 16px}
  a{color:#17181C}
  .btn,#go{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;
    text-decoration:none;font-weight:800;line-height:1.3}
  .btn{background:#FFC72C;color:#121214;min-height:50px;padding:12px 28px;font-size:17px;
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
  #go{background:#fff;color:#17181C;border:1.5px solid #77736B;min-height:44px;padding:9px 20px;font-size:15px;
    font-weight:700;box-shadow:0 1px 2px rgba(23,24,28,.08)}
  #msg{color:#17181C;font-size:21px;font-weight:800}
  :focus-visible{outline:2.5px solid #17181C;outline-offset:3px}
</style>
</head>
<body>
  <div>
    <p id="msg">פותח את החדר…</p>
    <p id="app" hidden><a class="btn" id="openApp" href="#">פתיחה באפליקציה</a></p>
    <p><a id="go" href="../">המשך בדפדפן</a></p>
  </div>
<script>
/* מעבירים את הקוד לעמוד המשחק, ששם הטיפול בהצטרפות כבר קיים
   ונבדק. עומדים על אותם כללים כמו fromLink ב-versus.js. */
(function(){
  var c = (new URLSearchParams(location.search).get("room") || "")
    .toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 4);
  var to = c.length === 4 ? "../?room=" + c : "../";
  document.getElementById("go").setAttribute("href", to);

  var pkg = "sportdle.techbynoam.com";
  var inApp = !!window.Capacitor;
  var android = navigator.userAgent.toLowerCase().indexOf("android") !== -1;

  /* בתוך האפליקציה היא כבר פתוחה, ובלי חבילה אין לאן לפתוח. */
  if (inApp || !android || !pkg || c.length !== 4){ location.replace(to); return; }

  /* intent:// — עובד גם מדפדפן פנימי של וואטסאפ, ואם האפליקציה
     אינה מותקנת אנדרואיד נופל ל-browser_fallback_url בשקט. */
  var https = "https://sportdle.techbynoam.com" +
              "/join/?room=" + c;
  var host = https.split("://")[1];
  var intent = "intent://" + host + "#Intent;scheme=https;package=" + pkg +
               ";S.browser_fallback_url=" + encodeURIComponent(https) + ";end";

  document.getElementById("msg").textContent = "הוזמנת לחדר " + c;
  document.getElementById("openApp").setAttribute("href", intent);
  document.getElementById("app").hidden = false;
})();
</script>
</body>
</html>
