<title>ביתרדל · קרב</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>
:root{--ink:#0C0C0E;--ink2:#141418;--ink3:#1C1C22;--line:#2E2E36;
  --brand:#FFC72C;--near:#8A6A1C;--slate:#24242A;--text:#F2F2F0;--dim:#8C8C94;--r:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{background:var(--ink);color:var(--text);font-family:'Heebo',system-ui,sans-serif;
  font-size:16px;line-height:1.5;min-height:100dvh;display:flex;flex-direction:column}
.scarf{height:12px;background:repeating-linear-gradient(115deg,var(--brand) 0 14px,var(--ink) 14px 28px)}
.wrap{max-width:520px;width:100%;margin:0 auto;padding:0 14px 40px;flex:1}
@media(min-width:640px){.wrap{max-width:580px;padding:0 28px 50px;
  border-inline:1px solid rgba(46,46,54,.7)}}
header{padding:20px 0 14px;text-align:center}
h1{font-family:'Suez One',serif;font-size:34px;color:var(--brand);line-height:1}
h1 small{display:block;font-family:'Heebo';font-size:12px;color:var(--dim);font-weight:500;margin-top:6px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px}
.card h2{font-family:'Suez One',serif;font-size:20px;color:var(--brand);margin-bottom:8px}
.card p{font-size:13.5px;color:var(--dim);line-height:1.65}
label{display:block;font-size:12px;color:var(--dim);margin:14px 0 5px}
input,select{width:100%;padding:13px 15px;background:var(--ink);border:1.5px solid var(--line);
  border-radius:var(--r);color:var(--text);font-family:inherit;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--brand)}
input.code{text-align:center;font-size:30px;font-weight:900;letter-spacing:.28em;
  font-family:'Suez One',serif;text-transform:uppercase;direction:ltr}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:var(--r);
  background:var(--brand);color:var(--ink);font-family:inherit;font-size:16px;font-weight:900;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:none;color:var(--dim);border:1.5px solid var(--line);font-weight:700;font-size:14px}
button:active:not(:disabled){transform:translateY(1px)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.hide{display:none!important}
.err{color:#E8B77A;font-size:13px;margin-top:10px;min-height:18px}

/* לובי */
.roomcode{font-family:'Suez One',serif;font-size:46px;color:var(--brand);text-align:center;
  letter-spacing:.14em;direction:ltr;margin:6px 0}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.plist div{display:flex;justify-content:space-between;align-items:center;background:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:14.5px;font-weight:700}
.plist div i{font-style:normal;font-size:11px;color:var(--dim);font-weight:500}
.plist div.me{border-color:var(--brand)}

/* משחק */
.bar{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;
  display:flex;flex-direction:row-reverse;margin-top:10px}
.bar i{display:block;height:100%;background:var(--brand);width:100%}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:8px}
.meta b{color:var(--text);font-weight:900}
.clues{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.clue{background:var(--slate);border-radius:9px;padding:12px 14px;display:flex;
  justify-content:space-between;align-items:baseline;opacity:0;transform:translateY(-6px);
  transition:opacity .3s,transform .3s}
.clue.on{opacity:1;transform:none}
.clue span{font-size:11.5px;color:var(--dim)}
.clue b{font-size:17px;font-weight:900;unicode-bidi:isolate}
.clue.on.fresh{background:var(--brand);color:var(--ink)}
.clue.on.fresh span{color:rgba(12,12,14,.7)}
#sugg{position:absolute;bottom:calc(100% + 6px);inset-inline:0;background:var(--ink3);
  border:1.5px solid var(--line);border-radius:var(--r);max-height:190px;overflow:auto;z-index:20;display:none}
#sugg.on{display:block}
#sugg button{width:100%;margin:0;text-align:start;padding:11px 15px;background:none;border:0;
  border-bottom:1px solid var(--line);color:var(--text);font-size:15px;font-weight:500;border-radius:0}
#sugg button:hover{background:var(--brand);color:var(--ink);font-weight:700}
.answerbox{position:relative;margin-top:16px}
.feed{margin-top:10px;font-size:13px;min-height:20px}
.feed.good{color:var(--brand);font-weight:700}.feed.bad{color:var(--near)}

/* טבלה */
.board{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.board div{display:flex;align-items:center;gap:10px;background:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:11px 13px}
.board div.me{border-color:var(--brand)}
.board .rk{font-family:'Suez One',serif;font-size:17px;color:var(--dim);width:22px;text-align:center}
.board div:first-child .rk{color:var(--brand)}
.board .nm{flex:1;font-weight:700;font-size:15px}
.board .sc{font-weight:900;font-variant-numeric:tabular-nums;color:var(--brand)}
.rev{text-align:center;margin-top:14px;font-size:15px}
.rev b{color:var(--brand);font-size:19px;font-family:'Suez One',serif}
footer{text-align:center;font-size:11px;color:#55555E;padding:14px 0 18px}
footer a{color:#55555E;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>

  <!-- מסך פתיחה -->
  <section id="scHome">
    <div class="card">
      <h2>פתיחת חדר</h2>
      <p>אתה מקבל קוד בן ארבע אותיות, משתף אותו, וכולם מצטרפים.</p>

      <input id="hostName" maxlength="14" placeholder="השם שיופיע בטבלה" autocomplete="off">
      <button id="btnCreate">פתיחת חדר</button>
    </div>
    <div class="card">
      <h2>הצטרפות</h2>
      <label for="joinCode">קוד החדר</label>
      <input id="joinCode" class="code" maxlength="4" placeholder="XXXX" autocomplete="off" inputmode="latin">
      <label for="joinName">איך קוראים לך?</label>
      <input id="joinName" maxlength="14" placeholder="השם שיופיע בטבלה" autocomplete="off">
      <button id="btnJoin">כניסה</button>
      <div class="err" id="joinErr"></div>
    </div>
  </section>

  <!-- לובי -->
  <section id="scLobby" class="hide">
    <div class="card">
      <p style="text-align:center">קוד החדר</p>
      <div class="roomcode" id="lobbyCode">----</div>
      <button class="ghost" id="btnShare">שיתוף הקוד</button>
    </div>
    <div class="card">
      <h2>מי בחדר</h2>
      <div class="plist" id="lobbyPlayers"></div>
    </div>
    <div class="card" id="hostBox">
      <h2>הגדרות</h2>
      <label for="setRounds">כמה סיבובים</label>
      <select id="setRounds"><option>5</option><option selected>10</option><option>15</option></select>
      <label for="setReveal">כל כמה שניות נחשף רמז</label>
      <select id="setReveal"><option value="4">4</option><option value="5" selected>5</option><option value="7">7</option></select>
      <button id="btnStart">התחלה</button>
      <div class="err" id="startErr"></div>
    </div>
    <p id="waitMsg" class="card hide" style="text-align:center;color:var(--dim)">
      מחכים שמנהל החדר יתחיל…</p>
  </section>

  <!-- משחק -->
  <section id="scPlay" class="hide">
    <div class="card">
      <div class="meta">
        <span>סיבוב <b id="rNum">1</b>/<b id="rTot">10</b></span>
        <span><b id="rTime">30</b> שניות</span>
      </div>
      <div class="bar"><i id="rBar"></i></div>
      <div class="clues" id="clues"></div>
      <div class="answerbox">
        <div id="sugg"></div>
        <input id="answer" placeholder="מי השחקן?" autocomplete="off" spellcheck="false">
      </div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="card">
      <div class="board" id="liveBoard"></div>
    </div>
  </section>

  <!-- סיום סיבוב -->
  <section id="scReveal" class="hide">
    <div class="card">
      <div class="rev" id="revText"></div>
      <div class="board" id="revBoard"></div>
    </div>
  </section>

  <!-- סיום -->
  <section id="scEnd" class="hide">
    <div class="card">
      <h2 style="text-align:center">סוף המשחק</h2>
      <div class="board" id="endBoard"></div>
      <button id="btnAgain">חדר חדש</button>
      <button class="ghost" id="btnHome">חזרה למשחק היומי</button>
    </div>
  </section>

  <footer>
    ביתרדל · פרויקט אוהדים · לא רשמי ·
    <a href="https://techbynoam.up.railway.app/" target="_blank" rel="noopener">TechByNoam</a>
    <span id="bld" style="opacity:.5"></span>
  </footer>
</div>

const POS_HE={GK:"שוער",DF:"מגן",MF:"קשר",FW:"חלוץ"};
const NAT_HE={IL:"ישראל",UA:"אוקראינה",HU:"הונגריה",GH:"גאנה",MK:"מקדוניה",PT:"פורטוגל",
  BR:"ברזיל",AR:"ארגנטינה",ES:"ספרד",FR:"צרפת",NG:"ניגריה",GE:"גאורגיה",CO:"קולומביה",
  RU:"רוסיה",CM:"קמרון",RO:"רומניה",UY:"אורוגוואי",CL:"צ'ילה",HR:"קרואטיה",RS:"סרביה",
  SK:"סלובקיה",CI:"חוף השנהב",CD:"קונגו",SN:"סנגל",NL:"הולנד",BE:"בלגיה",DE:"גרמניה",
  IT:"איטליה",PL:"פולין",SE:"שוודיה",US:"ארה\"ב",CR:"קוסטה ריקה",VE:"ונצואלה",TG:"טוגו",
  MQ:"מרטיניק",NC:"קלדוניה החדשה",TT:"טרינידד",PY:"פרגוואי",MG:"מדגסקר",CV:"כף ורדה",
  MD:"מולדובה",BY:"בלארוס",XK:"קוסובו",AL:"אלבניה",SI:"סלובניה",CZ:"צ'כיה",AT:"אוסטריה",
  CH:"שווייץ",GR:"יוון",TR:"טורקיה",EN:"אנגליה",AU:"אוסטרליה",BG:"בולגריה",DK:"דנמרק",
  ME:"מונטנגרו",BA:"בוסניה",GT:"גואטמלה",MA:"מרוקו",LV:"לטביה",LT:"ליטא",KZ:"קזחסטן",
  ZM:"זמביה",JM:"ג'מייקה",KE:"קניה",RW:"רואנדה",SR:"סורינאם",FI:"פינלנד",GA:"גבון",PE:"פרו"};

const season = y => `${String(y-1).slice(-2)}/${String(y).slice(-2)}`;
const norm = t => (t||"").replace(/[-־]/g," ").replace(/['"״׳]/g,"")
                         .replace(/\s+/g," ").trim();

/* חמשת הרמזים, לפי סדר חשיפה */
function cluesOf(p){
  return [
    ["עמדה",  POS_HE[p.pos] || p.pos],
    ["לאום",  NAT_HE[p.nat] || p.nat],
    ["עונה ראשונה", season(p.spells[0][0])],
    ["תארים", String(p.titles)],
    ["נולד",  String(p.born)]
  ];
}
const CLUES = 5;
const POINTS = [5,4,3,2,1];        // לפי כמה רמזים היו חשופים

/* ============================================================
   3. עזרים
   ============================================================ */
const $ = s => document.querySelector(s);
const show = id => { ["scHome","scLobby","scPlay","scReveal","scEnd"]
  .forEach(s => $("#"+s).classList.toggle("hide", s !== id)); };

const uid = (() => {
  let u = null;
  try { u = localStorage.getItem("bd:uid"); } catch(e){}
  if (!u){ u = Math.random().toString(36).slice(2,10);
           try{ localStorage.setItem("bd:uid",u); }catch(e){} }
  return u;
})();

let skew = 0;                       // הפרש שעון מול השרת
onValue(ref(db,".info/serverTimeOffset"), s => skew = s.val() || 0);
const now = () => Date.now() + skew;

function mkCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // בלי I O 0 1
  return Array.from({length:4}, () => A[Math.floor(Math.random()*A.length)]).join("");
}
function mulberry32(a){
  return function(){ a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; };
}
/** בחירת סיבובים דטרמיניסטית מהקוד — כל המשתתפים מקבלים אותם שחקנים */
function pickRounds(code, n){
  let seed = 0; for (const c of code) seed = (seed*31 + c.charCodeAt(0))|0;
  const r = mulberry32(seed), idx = POOL.map((_,i)=>i);
  for (let i=idx.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx.slice(0, n);
}

/* ============================================================
   4. מצב מקומי
   ============================================================ */
let room = null, roomRef = null, unsub = null, state = null;
let isHost = false, tick = null, lastStage = -1, locked = 0, answered = false;

/* ============================================================
   5. פתיחה והצטרפות
   ============================================================ */
$("#btnCreate").addEventListener("click", async () => {
  const name = $("#hostName").value.trim();
  if (!name) return $("#hostName").focus();
  const code = mkCode();
  isHost = true; room = code; roomRef = ref(db, "rooms/"+code);
  await set(roomRef, {
    createdAt: serverTimestamp(), host: uid, status: "lobby",
    settings: { rounds: 10, revealMs: 5000, roundMs: 30000 },
    players: { [uid]: { name, score: 0, at: serverTimestamp() } }
  });
  onDisconnect(ref(db, `rooms/${code}/players/${uid}/gone`)).set(true);
  watch();
});

$("#joinCode").addEventListener("input", e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z2-9]/g,"").slice(0,4);
});

$("#btnJoin").addEventListener("click", async () => {
  const code = $("#joinCode").value.trim().toUpperCase();
  const name = $("#joinName").value.trim();
  const err  = $("#joinErr");
  err.textContent = "";
  if (code.length !== 4) return err.textContent = "קוד בן ארבע אותיות";
  if (!name) return err.textContent = "צריך שם";

  const snap = await get(ref(db, "rooms/"+code));
  if (!snap.exists()) return err.textContent = "אין חדר עם הקוד הזה";
  if (snap.val().status === "done") return err.textContent = "המשחק בחדר הזה כבר נגמר";

  room = code; isHost = snap.val().host === uid; roomRef = ref(db, "rooms/"+code);
  await update(ref(db, `rooms/${code}/players/${uid}`),
               { name, score: 0, at: serverTimestamp(), gone: null });
  onDisconnect(ref(db, `rooms/${code}/players/${uid}/gone`)).set(true);
  watch();
});

$("#btnShare").addEventListener("click", async () => {
  const txt = `בואו נשחק ביתרדל · קרב\nקוד החדר: ${room}\n${location.origin}${location.pathname}`;
  try{
    if (navigator.share) return void await navigator.share({ text: txt });
    await navigator.clipboard.writeText(txt);
    $("#btnShare").textContent = "הועתק ✓";
    setTimeout(()=> $("#btnShare").textContent = "שיתוף הקוד", 1800);
  }catch(e){}
});

$("#btnStart").addEventListener("click", async () => {
  const ps = Object.values(state?.players || {}).filter(p => !p.gone);
  if (ps.length < 2) return $("#startErr").textContent = "צריך לפחות שני שחקנים";
  await update(roomRef, {
    status: "playing", round: 0, roundStartedAt: serverTimestamp(),
    settings: {
      rounds:   +$("#setRounds").value,
      revealMs: +$("#setReveal").value * 1000,
      roundMs:  +$("#setReveal").value * 1000 * CLUES + 6000
    }
  });
});

$("#btnAgain").addEventListener("click", () => location.reload());
$("#btnHome").addEventListener("click", () => location.href = "./");

/* ============================================================
   6. מעקב אחרי מצב החדר
   ============================================================ */
function watch(){
  if (unsub) off(roomRef);
  unsub = onValue(roomRef, snap => {
    state = snap.val();
    if (!state) return;
    isHost = state.host === uid;
    render();
  });
}

function livePlayers(){
  return Object.entries(state.players || {})
    .filter(([,p]) => !p.gone)
    .map(([id,p]) => ({ id, ...p, score: p.score || 0 }))
    .sort((a,b) => b.score - a.score || (a.at||0) - (b.at||0));
}

function render(){
  if (state.status === "lobby"){
    show("scLobby");
    $("#lobbyCode").textContent = room;
    $("#lobbyPlayers").innerHTML = livePlayers().map(p =>
      `<div class="${p.id===uid?"me":""}">${esc(p.name)}
         <i>${p.id===state.host?"מנהל החדר":""}</i></div>`).join("");
    $("#hostBox").classList.toggle("hide", !isHost);
    $("#waitMsg").classList.toggle("hide", isHost);
    return;
  }
  if (state.status === "done"){ show("scEnd"); drawBoard("#endBoard"); stopTick(); return; }
  if (state.status === "playing") runRound();
}

const esc = s => String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

function drawBoard(sel){
  $(sel).innerHTML = livePlayers().map((p,i) =>
    `<div class="${p.id===uid?"me":""}">
       <span class="rk">${i+1}</span>
       <span class="nm">${esc(p.name)}</span>
       <span class="sc">${p.score}</span>
     </div>`).join("");
}

/* ============================================================
   7. סיבוב
   ============================================================ */
function stopTick(){ if (tick){ clearInterval(tick); tick = null; } }

function runRound(){
  const st = state.settings, rounds = pickRounds(room, st.rounds);
  const idx = state.round;
  if (idx >= rounds.length){ finishGame(); return; }

  const answer = POOL[rounds[idx]];
  const res    = (state.results || {})[idx] || null;

  if (res){ showReveal(answer, res); return; }

  show("scPlay");
  $("#rNum").textContent = idx + 1;
  $("#rTot").textContent = st.rounds;
  if (lastStage === -1 || $("#clues").dataset.round != idx) buildClues(idx);
  drawBoard("#liveBoard");

  stopTick();
  tick = setInterval(() => {
    const el = now() - (state.roundStartedAt || now());
    const left = Math.max(0, st.roundMs - el);
    $("#rTime").textContent = Math.ceil(left/1000);
    $("#rBar").style.width = (left / st.roundMs * 100) + "%";

    const stage = Math.min(CLUES, Math.floor(el / st.revealMs) + 1);
    if (stage !== lastStage){ revealTo(stage); lastStage = stage; }

    if (left <= 0){ stopTick(); closeRound(idx, null, 0); }
  }, 200);
}

function buildClues(idx){
  const c = $("#clues");
  c.dataset.round = idx; c.innerHTML = ""; lastStage = -1;
  answered = false; locked = 0;
  $("#answer").value = ""; $("#answer").disabled = false;
  $("#feed").textContent = ""; $("#feed").className = "feed";
  const rounds = pickRounds(room, state.settings.rounds);
  cluesOf(POOL[rounds[idx]]).forEach(([k,v]) => {
    const d = document.createElement("div");
    d.className = "clue";
    d.innerHTML = `<span>${k}</span><b>${v}</b>`;
    c.appendChild(d);
  });
}

function revealTo(stage){
  [...$("#clues").children].forEach((el,i) => {
    el.classList.toggle("on", i < stage);
    el.classList.toggle("fresh", i === stage-1);
  });
}

/** סוגר סיבוב — טרנזקציה כדי שרק ניחוש אחד ייקלט כמנצח */
async function closeRound(idx, winnerId, pts){
  const r = ref(db, `rooms/${room}/results/${idx}`);
  const out = await runTransaction(r, cur => {
    if (cur) return;                                  // כבר נסגר
    return { winner: winnerId || null, pts, at: serverTimestamp() };
  });
  if (!out.committed) return;

  if (winnerId){
    await runTransaction(ref(db, `rooms/${room}/players/${winnerId}/score`),
                         s => (s || 0) + pts);
  }
  // כל לקוח שמגיע לכאן ראשון מקדם — הטרנזקציה מונעת קפיצה כפולה
  setTimeout(() => {
    runTransaction(ref(db, `rooms/${room}/round`), r2 => (r2 === idx ? idx + 1 : undefined))
      .then(() => update(roomRef, { roundStartedAt: serverTimestamp() }));
  }, 4200);
}

function showReveal(answer, res){
  show("scReveal");
  stopTick();
  const who = res.winner ? (state.players[res.winner]?.name || "מישהו") : null;
  $("#revText").innerHTML = who
    ? `<b>${esc(answer.he)}</b><br>${esc(who)} זיהה ראשון · ${res.pts} נקודות`
    : `<b>${esc(answer.he)}</b><br>אף אחד לא זיהה`;
  drawBoard("#revBoard");
}

async function finishGame(){
  stopTick();
  if (isHost) await update(roomRef, { status: "done" });
  show("scEnd"); drawBoard("#endBoard");
}

/* ============================================================
   8. ניחוש
   ============================================================ */
const inp = $("#answer"), sg = $("#sugg");

inp.addEventListener("input", () => {
  const q = norm(inp.value);
  if (!q) return closeSugg();
  const hits = POOL.filter(p => norm(p.he).includes(q)).slice(0,6);
  sg.innerHTML = hits.map(p => `<button type="button" data-n="${esc(p.he)}">${esc(p.he)}</button>`).join("");
  sg.classList.toggle("on", hits.length > 0);
});
function closeSugg(){ sg.classList.remove("on"); sg.innerHTML = ""; }
sg.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b){ inp.value = b.dataset.n; closeSugg(); submit(); }
});
inp.addEventListener("keydown", e => {
  if (e.key === "Enter"){ e.preventDefault();
    const first = sg.querySelector("button");
    if (first && norm(inp.value) !== norm(first.dataset.n)) inp.value = first.dataset.n;
    closeSugg(); submit(); }
});

function submit(){
  if (answered || !state || state.status !== "playing") return;
  if (now() < locked) return;
  const idx = state.round;
  if ((state.results || {})[idx]) return;

  const rounds = pickRounds(room, state.settings.rounds);
  const answer = POOL[rounds[idx]];
  const guess  = norm(inp.value);
  if (!guess) return;
  inp.value = ""; closeSugg();

  if (guess === norm(answer.he)){
    answered = true;
    inp.disabled = true;
    const el = now() - (state.roundStartedAt || now());
    const stage = Math.min(CLUES, Math.floor(el / state.settings.revealMs) + 1);
    const pts = POINTS[stage-1] || 1;
    $("#feed").textContent = `נכון! ${pts} נקודות`;
    $("#feed").className = "feed good";
    closeRound(idx, uid, pts);
  } else {
    locked = now() + 3000;
    $("#feed").textContent = "לא נכון · שלוש שניות המתנה";
    $("#feed").className = "feed bad";
    let n = 3;
    const c = setInterval(() => {
      if (--n <= 0){ clearInterval(c); $("#feed").textContent = ""; }
      else $("#feed").textContent = `לא נכון · ${n}`;
    }, 1000);
  }
}
</script>
